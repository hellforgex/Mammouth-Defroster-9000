[project]
name = "mammouth-defroster-9000"
version = "0.1.0"
description = "Mammouth Defroster 9000: FastMCP Desktop Cockpit & Windows 11 DevOps Automation for Mammouth.ai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.0",
    "httpx>=0.28.0",
    "psutil>=7.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "customtkinter>=5.2.0",
    "packaging>=24.0",
    "pyinstaller>=6.10.0",
]

[tool.setuptools.packages.find]
include = ["modules*"]
